<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小怪兽的博客工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6da;color:#374332;font:16px system-ui;padding:40px 46px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3c472d22;padding-bottom:20px}small{letter-spacing:3px;color:#8a907b;font-size:10px}h1{font-size:34px;font-weight:500;margin:12px 0 8px}p{color:#838b76;font-size:13px;line-height:1.8}a{color:inherit;text-decoration:none}header a,button{border:1px solid #5a664930;border-radius:5px;background:#f7f4e9;padding:12px 16px;font:12px system-ui;color:#5d6c4b;cursor:pointer}button:hover,header a:hover{background:#647455;color:white}h2{font-size:13px;font-weight:500;color:#81906d;letter-spacing:2px;margin:26px 0 15px}#categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#categories a{display:block;padding:16px;background:#f7f4e9;border:1px solid #64745520;border-radius:6px;font-size:13px;line-height:1.6}#categories a:hover{background:#d9dfce}#recent{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:24px}#recent a{display:block;padding:13px 0;border-bottom:1px solid #64745520;font-size:13px}#recent a:after{content:' ↗';color:#b37b52}#status{font-size:10px;color:#919780;margin-top:20px}footer{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px}button:focus-visible,a:focus-visible{outline:3px solid #b37b52;outline-offset:3px}@media(max-width:600px){body{padding:24px}h1{font-size:25px}#categories{grid-template-columns:1fr 1fr}#recent{grid-template-columns:1fr}header{gap:10px}header a{padding:10px;white-space:nowrap}}
</style></head><body><header><div><small>LITTLE MONSTER / BLOG</small><h1>我的博客工作台</h1><p>学习、实践，和一路留下的记录。</p></div><a href="https://lhg.littermonste.top/blog/" target="_blank" rel="noopener noreferrer">打开博客 ↗</a></header><h2>按主题翻阅</h2><nav id="categories" aria-label="博客分类"><p>正在打开分类…</p></nav><h2>最近更新</h2><ul id="recent" aria-label="最近的博客文章"></ul><footer><button id="diary">翻开随笔日记本 ↗</button><a href="https://lhg.littermonste.top/archives/" target="_blank" rel="noopener noreferrer">全部文章 ↗</a></footer><p id="status" role="status">正在读取博客…</p><script>
const base='https://lhg.littermonste.top/';
function link(url,text){const a=document.createElement('a');a.href=new URL(url,base).href;a.textContent=text;a.target='_blank';a.rel='noopener noreferrer';if(parent!==window && new URL(a.href).pathname.startsWith('/categories/'))a.onclick=e=>{e.preventDefault();parent.postMessage({type:'little-monster:open-book',url:a.href},location.origin)};return a}
fetch(new URL('blog/?room_sync='+Date.now(),base),{cache:'no-store',credentials:'omit'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(html=>{
 const doc=new DOMParser().parseFromString(html,'text/html');
 const categories=[...doc.querySelectorAll('a.card-category-list-link')];const posts=[...doc.querySelectorAll('a.article-title')];
 if(!categories.length&&!posts.length)throw Error();
 const nav=document.querySelector('#categories');nav.replaceChildren(...categories.map(a=>link(a.getAttribute('href'),a.querySelector('.card-category-list-name')?.textContent.trim()||a.textContent.trim())));
 document.querySelector('#recent').replaceChildren(...posts.map(a=>{const li=document.createElement('li');li.append(link(a.getAttribute('href'),a.textContent.trim()));return li}));
 document.querySelector('#status').textContent='来自博客的最新内容 · '+posts.length+' 篇近期文章';
}).catch(()=>{document.querySelector('#categories').replaceChildren(link(base+'categories/','去博客查看分类 ↗'));document.querySelector('#status').textContent='暂时没能读取最新目录，可以直接前往博客。'});
document.querySelector('#diary').onclick=()=>{if(parent!==window)parent.postMessage({type:'little-monster:open-diary'},location.origin);else window.open(base+'schedule/notes.html','_blank','noopener')};
</script></body></html>
